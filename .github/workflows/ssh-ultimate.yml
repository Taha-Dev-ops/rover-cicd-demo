name: SSH Ultimate Debug

on: [push]

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check SSH Secret
      run: |
        echo "=== SSH SECRET CHECK ==="
        echo "Secret exists: ${{ secrets.SSH_PRIVATE_KEY != '' }}"
        echo "Secret length: $(echo '${{ secrets.SSH_PRIVATE_KEY }}' | wc -l) lines"
        echo "First 3 lines:"
        echo '${{ secrets.SSH_PRIVATE_KEY }}' | head -3
        echo "Last 3 lines:"
        echo '${{ secrets.SSH_PRIVATE_KEY }}' | tail -3
    
    - name: Setup SSH Directory
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
    
    - name: Write SSH Key
      run: |
        echo '${{ secrets.SSH_PRIVATE_KEY }}' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "=== KEY FILE CHECK ==="
        ls -la ~/.ssh/
        echo "First line: $(head -1 ~/.ssh/id_rsa)"
        echo "Last line: $(tail -1 ~/.ssh/id_rsa)"
    
    - name: Test Key Format
      run: |
        if grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/id_rsa; then
          echo "✅ Key format looks correct"
        else
          echo "❌ Key format incorrect!"
          exit 1
        fi
    
    - name: SSH Keyscan
      run: |
        ssh-keyscan -H 192.168.88.132 >> ~/.ssh/known_hosts 2>&1 || echo "⚠️ Keyscan failed but continuing"
        cat ~/.ssh/known_hosts
    
    - name: SSH Connection Test (Verbose)
      run: |
        ssh -v -o StrictHostKeyChecking=no -o ConnectTimeout=5 root@192.168.88.132 "echo '✅ SSH Connected Successfully'" || echo "❌ SSH Failed"
